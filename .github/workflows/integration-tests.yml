name: Integration Tests

on:
  push:
    branches:
      - master
      - feature/use-statefulsets
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "TODO.md"
      - "game-server-template.schema.json"
      - ".github/**"
  pull_request:
    branches:
      - master
      - feature/use-statefulsets
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "TODO.md"
      - "game-server-template.schema.json"
      - ".github/**"
  workflow_dispatch:

jobs:
  kind-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout helm chart
        run: |
          git clone --depth 1 https://github.com/andyslucky/nautikalpanel-helm.git /tmp/nautikalpanel-helm || \
            cp -r ../nautikalpanel-helm /tmp/nautikalpanel-helm

      - name: Start kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: nautikal-ci
          wait: 120s

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Build Docker image
        run: docker build -t nautikalpanel:ci .

      - name: Load image into kind
        run: kind load docker-image nautikalpanel:ci --name nautikal-ci

      - name: Install nautikalpanel via Helm
        run: |
          helm install nautikal /tmp/nautikalpanel-helm/charts/nautikalpanel \
            --set image.repository=nautikalpanel \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set service.type=NodePort \
            --set config.kubernetes.namespace=nautikal \
            --wait --timeout 120s

      - name: Verify pod is running
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/instance=nautikal \
            --timeout=120s
          kubectl get pods -A
          kubectl logs -l app.kubernetes.io/instance=nautikal --tail=50

      - name: Port-forward backend
        run: |
          kubectl port-forward svc/nautikal-nautikalpanel 9090:80 &
          sleep 5

      - name: API smoke test (curl)
        run: |
          curl -sf http://localhost:9090/api/v1/game-servers || true
          curl -sf http://localhost:9090/api/v1/game-server-templates || true
          curl -sf http://localhost:9090/api/v1/template-repositories || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run integration e2e tests against real backend
        working-directory: frontend
        run: npx playwright test --config=playwright.integration.config.ts
        env:
          BASE_URL: http://localhost:9090

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          helm uninstall nautikal || true
          kind delete cluster --name nautikal-ci || true
